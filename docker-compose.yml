services:
  postgres:
    image: postgres:17
    container_name: cierra-postgres
    environment:
      POSTGRES_DB: cierra_dev
      POSTGRES_USER: cierra
      POSTGRES_PASSWORD: cierra
    ports:
      - "5432:5432"
    volumes:
      - cierra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cierra -d cierra_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cierra_postgres_data:

